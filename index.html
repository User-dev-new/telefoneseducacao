<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades Escolares - Tijucas/SC</title>
    <style>
        :root {
            --primary: #0f172a;
            --primary-accent: #2563eb;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --hover-row: #f1f5f9;
            --badge-bg: #e0f2fe;
            --badge-text: #0369a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            padding: 32px 16px;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Barra de pesquisa */
        .search-section {
            margin-bottom: 20px;
        }

        .search-box-wrapper {
            position: relative;
        }

        #searchBox {
            width: 100%;
            padding: 16px 20px 16px 48px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            outline: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        #searchBox:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .counter {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin: 10px 0 16px 4px;
            font-weight: 500;
        }

        /* Estrutura da Tabela em 3 Colunas */
        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px -2px rgba(0, 0, 0, 0.05);
        }

        .table-header {
            display: grid;
            grid-template-columns: 2.2fr 1.5fr 1.3fr;
            background-color: #f1f5f9;
            padding: 14px 20px;
            border-bottom: 2px solid var(--border-color);
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .table-body {
            display: flex;
            flex-direction: column;
        }

        .table-row {
            display: grid;
            grid-template-columns: 2.2fr 1.5fr 1.3fr;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.15s ease;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .table-row:hover {
            background-color: var(--hover-row);
        }

        /* Coluna 1: Unidade Escolar */
        .col-unidade {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--primary);
            padding-right: 12px;
        }

        /* Coluna 2: Bairro */
        .col-bairro {
            padding-right: 12px;
        }

        .badge-bairro {
            display: inline-block;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 20px;
        }

        /* Coluna 3: Telefone */
        .col-telefone {
            display: flex;
            justify-content: flex-start;
        }

        .phone-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--primary-accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 7px 12px;
            border-radius: 8px;
            background-color: #eff6ff;
            border: 1px solid #dbeafe;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .phone-btn:hover {
            background-color: var(--primary-accent);
            color: #ffffff;
            border-color: var(--primary-accent);
        }

        /* Estado vazio */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Responsividade para telas menores */
        @media (max-width: 680px) {
            .table-header {
                display: none;
            }

            .table-row {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 16px;
            }

            .col-telefone {
                margin-top: 4px;
            }

            .phone-btn {
                width: 100%;
                justify-content: center;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Unidades Escolares - Tijucas</h1>
            <p class="subtitle">Lista telefônica e endereços da rede municipal de ensino</p>
        </header>

        <div class="search-section">
            <div class="search-box-wrapper">
                <span class="search-icon">🔍</span>
                <input 
                    type="text" 
                    id="searchBox" 
                    placeholder="Digite o nome da unidade, bairro ou telefone..." 
                    autocomplete="off"
                >
            </div>
            <div id="counter" class="counter"></div>
        </div>

        <div class="table-card">
            <div class="table-header">
                <div>Unidade Escolar</div>
                <div>Bairro</div>
                <div>Telefone</div>
            </div>
            <div id="listRows" class="table-body"></div>
        </div>
    </div>

    <script>
        // Lista organizada em rigorosa ordem alfabética e com a correção solicitada
        const escolas = [
            { nome: "CEI Eneide Mannrich dos Santos", bairro: "Centro", contato: "(48) 3263-4589" },
            { nome: "CEI Hercílio Giacomossi", bairro: "Nova Descoberta", contato: "(48) 3220-1183" },
            { nome: "CEI Ivania Lemos Freitas", bairro: "Praça", contato: "(48) 3263-5463" },
            { nome: "CEI Mãe Aurora", bairro: "Centro", contato: "(48) 3263-2728" },
            { nome: "CEI Prof Marco Aurélio de Oliveira", bairro: "Areias", contato: "(48) 3263-5712" },
            { nome: "CEI Profª Maria Helena Machado", bairro: "Centro", contato: "(48) 3263-6201" },
            { nome: "CEI Professor Manoel dos Anjos", bairro: "Centro", contato: "(48) 3263-2892" },
            { nome: "CEI Silivia Telles", bairro: "Sul do Rio", contato: "(48) 3263-2215" },
            { nome: "CEI Zilda Maria Perixer", bairro: "Centro", contato: "(48) 3263-0305" },
            { nome: "CMEI Profa Maria de Lourdes Souza Furtado", bairro: "Joáia", contato: "(48) 3220-1186" },
            { nome: "EEF Alexandre Ternes Filho", bairro: "Joáia", contato: "(48) 3263-5693" },
            { nome: "EEF Dep. Walter Vicente Gomes", bairro: "Praça", contato: "(48) 3263-0337" },
            { nome: "EEF João Caetano", bairro: "Areias", contato: "(48) 3263-0355" },
            { nome: "EEF José Feller", bairro: "Oliveira", contato: "(48) 3220-1184" },
            { nome: "EEF Madre Sabina", bairro: "Timbé", contato: "(48) 3220-0152" },
            { nome: "EEF Marcilio M da Silva", bairro: "Morretes", contato: "(48) 3220-1185" },
            { nome: "EEF Mercedes Júlia Adão", bairro: "Centro", contato: "(48) 3263-5952" },
            { nome: "EEF Monsenhor Augusto Zucco", bairro: "Centro do Itinga", contato: "(48) 3263-9131" },
            { nome: "EEF Ondina Maria Dias", bairro: "XV de Novembro", contato: "(48) 3263-6849" },
            { nome: "EEF Osmário Giacomossi", bairro: "Nova Descoberta", contato: "(48) 3263-3487" },
            { nome: "EEF. Brilho do Sol", bairro: "Joáia", contato: "(48) 3263-2358" },
            { nome: "EEF. Campo Novo", bairro: "Campo Novo", contato: "(48) 3220-0134" },
            { nome: "EEF. Santa Terezinha", bairro: "Universitário", contato: "(48) 3263-0317" },
            { nome: "Pré-Escolar Criança Feliz", bairro: "Centro", contato: "(48) 3263-1862" }
        ];

        const searchBox = document.getElementById('searchBox');
        const listRows = document.getElementById('listRows');
        const counterEl = document.getElementById('counter');

        function cleanPhone(phone) {
            return phone.replace(/\D/g, '');
        }

        function normalizeText(text) {
            return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function renderRows(dados) {
            listRows.innerHTML = '';
            counterEl.textContent = `${dados.length} de ${escolas.length} unidades encontradas`;

            if (dados.length === 0) {
                listRows.innerHTML = `
                    <div class="empty-state">
                        Nenhuma unidade escolar encontrada.
                    </div>
                `;
                return;
            }

            dados.forEach(item => {
                const row = document.createElement('div');
                row.className = 'table-row';
                row.innerHTML = `
                    <div class="col-unidade">${item.nome}</div>
                    <div class="col-bairro"><span class="badge-bairro">📍 ${item.bairro}</span></div>
                    <div class="col-telefone">
                        <a href="tel:+55${cleanPhone(item.contato)}" class="phone-btn">
                            📞 ${item.contato}
                        </a>
                    </div>
                `;
                listRows.appendChild(row);
            });
        }

        searchBox.addEventListener('input', (e) => {
            const query = normalizeText(e.target.value.trim());

            const filtrados = escolas.filter(escola => {
                const nomeNorm = normalizeText(escola.nome);
                const bairroNorm = normalizeText(escola.bairro);
                const telLimpo = cleanPhone(escola.contato);

                return nomeNorm.includes(query) || 
                       bairroNorm.includes(query) || 
                       telLimpo.includes(query) || 
                       escola.contato.includes(query);
            });

            renderRows(filtrados);
        });

        // Inicialização
        renderRows(escolas);
    </script>
</body>
</html>
